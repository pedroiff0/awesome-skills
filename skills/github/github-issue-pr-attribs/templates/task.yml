name: 📋 Task (Tarefa / Melhoria)
description: Tarefa pontual, refactor, docs, chore ou melhoria sem nova funcionalidade.
title: "chore: <resumo curto da tarefa>"
labels: ["documentation"]
assignees: ["pedroiff0"]
body:
  - type: markdown
    attributes:
      value: |
        **Atribuições padrão desta issue (preenchidas automaticamente):**
        - **Assignee:** pedroiff0
        - **Project:** Financas App - Roadmap
        - **Milestone:** Backlog (mover quando ganhar release alvo)
        - **Reviewer:** definido no PR de entrega
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: O que será feito e por quê.
      placeholder: "Atualizar README com novo fluxo de módulos."
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: Escopo / Fora de escopo
      description: O que entra e o que fica explicitamente de fora.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist pré-PR
      options:
        - label: "Mantive a arquitetura de camadas (AGENTS.md)"
        - label: "Sem segredo no código; .env.example atualizado se preciso"
