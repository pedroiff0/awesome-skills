name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills & templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL.md + manifests + issue forms
        run: |
          python3 - <<'PY'
          import glob, yaml, json, sys, re
          RECOMMENDED = ("version", "author", "license", "platforms")
          errs, warns = [], []

          for f in glob.glob("skills/**/SKILL.md", recursive=True):
              try:
                  txt = open(f, encoding="utf-8").read()
                  m = re.match(r"^---\n(.*?)\n---\n", txt, re.S)
                  if not m:
                      errs.append(f"{f}: sem frontmatter"); continue
                  fm = yaml.safe_load(m.group(1)) or {}
                  if "name" not in fm: errs.append(f"{f}: falta name")
                  if "description" not in fm: errs.append(f"{f}: falta description")
                  for k in RECOMMENDED:
                      if k not in fm: warns.append(f"{f}: recomendado ter '{k}'")
              except Exception as e:
                  errs.append(f"{f}: {e}")

          for f in glob.glob("templates/**/manifest.json", recursive=True):
              try:
                  j = json.load(open(f))
                  if "name" not in j or "version" not in j:
                      errs.append(f"{f}: falta name/version")
              except Exception as e:
                  errs.append(f"{f}: JSON invalido: {e}")

          VALID = {"markdown","textarea","input","dropdown","checkboxes","radio","code","yaml_metadata"}
          for f in glob.glob(".github/ISSUE_TEMPLATE/*.yml"):
              try:
                  d = yaml.safe_load(open(f))
                  for i, b in enumerate(d.get("body", [])):
                      if b.get("type") not in VALID: errs.append(f"{f}[{i}] type {b.get('type')!r}")
                      a = b.get("attributes", {})
                      if b.get("type") in ("textarea","input","dropdown","radio","checkboxes") and "label" not in a:
                          errs.append(f"{f}[{i}] sem label")
              except Exception as e:
                  errs.append(f"{f}: {e}")

          for w in warns: print("WARN:", w)
          if errs:
              print("FAILURES:"); [print(" -", e) for e in errs]; sys.exit(1)
          print("ALL_OK")
          PY

      - name: Regenerate index (sanity)
        run: python3 tools/gen_index.py

      - name: Secret scan (basic)
        run: |
          if grep -rEn "ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}" skills templates .github 2>/dev/null; then
            echo "::error::Possivel segredo encontrado"; exit 1
          fi
          echo "no-secrets"
