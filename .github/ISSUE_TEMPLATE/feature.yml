name: 🚀 Feature Request
description: Propose a new skill, agent, plugin, or enhancement to the catalog.
title: "feat: <short summary>"
labels: ["enhancement"]
assignees: ["pedroiff0"]
body:
  - type: markdown
    attributes:
      value: |
        **Standard assignments (auto):**
        - Assignee: pedroiff0
        - Project: Awesome Skills — Roadmap
        - Milestone: Backlog
        - Reviewer: assigned on the implementation PR
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - "new skill"
        - "new agent template"
        - "new plugin template"
        - "enhancement to existing skill"
        - "index / README improvement"
        - "docs / governance"
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What do you want and why?
      validations:
        required: true
  - type: textarea
    id: value
    attributes:
      label: Value
      description: Who benefits and how?
      validations:
        required: true
  - type: textarea
    id: runtime
    attributes:
      label: Target runtime(s)
      placeholder: "Hermes / Claude / Cursor / Windsurf / OpenClaw / All"
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "I searched open issues for duplicates"
        - label: "I checked the wiki and docs"
        - label: "I'm willing to contribute the implementation"
